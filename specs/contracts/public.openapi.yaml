openapi: 3.1.0
info:
  title: redAI Personal owner API
  version: 1.0.0-draft.1
  description: Normative interface specification, not an implemented service. Domain
    authorization remains mandatory.
servers:
- url: /api/v1
security:
- OwnerSession: []
paths:
  /auth/login:
    post:
      operationId: login
      summary: login
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: ./schemas/api.schema.json#/$defs/Session
        default:
          description: Structured error
          content:
            application/json:
              schema:
                $ref: ./schemas/common.schema.json#/$defs/Error
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/api.schema.json#/$defs/LoginRequest
  /auth/logout:
    post:
      operationId: logout
      summary: logout
      responses:
        '204':
          description: No content
        default:
          description: Structured error
          content:
            application/json:
              schema:
                $ref: ./schemas/common.schema.json#/$defs/Error
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema: &id001
          type: string
          minLength: 32
